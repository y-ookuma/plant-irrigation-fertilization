<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>LAI潅水・施肥モデル</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- D3.js -->
  <script src="d3.min.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <h2>LAI → 潅水量 → NPK施肥モデル</h2>

  <label>作物:</label>
  <select id="crop">
    <option value="cucumber">キュウリ</option>
    <option value="tomato">トマト</option>
    <option value="pepper">ピーマン</option>
    <option value="strawberry">イチゴ</option>
  </select>

  <br><br>

  <label>気温(℃):</label>
  <input id="temp" type="number" placeholder="未入力なら屋外値">

  <label>湿度(%):</label>
  <input id="rh" type="number" placeholder="未入力なら屋外値">

  <br><br>

  <label>株数/m2:</label>
  <input id="density" type="number" value="2.5">

  <label>面積m2/株:</label>
  <input id="area" type="number" value="0.30">

  <br><br>

  <button id="calcGraph">計算＆グラフ表示</button>

  <pre id="output"></pre>

  <h3>短波放射</h3>
  <svg id="graphSW"></svg>

  <h3>気温</h3>
  <svg id="graphT"></svg>

  <h3>潅水量</h3>
  <svg id="graphIrr"></svg>

  <h3>NPK複合グラフ</h3>
  <svg id="graphNPK"></svg>

  <h3>収量予測（kg/株/day）</h3>
  <svg id="graphYield"></svg>

  <h3>NPK施肥量（g/株/day）</h3>
  <table id="npkTable">
    <thead>
      <tr><th>N</th><th>P</th><th>K</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <button id="csvBtn">NPK CSV保存</button>
  <button id="pngBtn">NPKグラフ PNG保存</button>

  <!-- app.js を module として読み込む -->
  <script type="module" src="app.js"></script>
</body>
</html>
