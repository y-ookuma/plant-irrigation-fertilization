<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>LAI潅水・施肥モデル</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <script src="d3.min.js"></script>
</head>
<body>
  <h2>LAI → 潅水量 → NPK施肥モデル</h2>

  気温(℃): <input id="temp" type="number" placeholder="未入力なら屋外値"><br>
  湿度(%): <input id="rh" type="number" placeholder="未入力なら屋外値"><br>
  株数/m2: <input id="density" type="number" value="2.5"><br>
  面積m2/株: <input id="area" type="number" value="0.30"><br>

  <button id="calcGraph">計算＆グラフ表示</button>

  <pre id="output"></pre>

  <h3>短波放射</h3>
  <svg id="graphSW"></svg>

  <h3>気温</h3>
  <svg id="graphT"></svg>

  <h3>潅水量</h3>
  <svg id="graphIrr"></svg>

  <h3>NPK複合グラフ</h3>
  <svg id="graphNPK"></svg>

  <h3>NPK施肥量（g/株/day）</h3>
  <table id="npkTable">
    <thead>
      <tr><th>N</th><th>P</th><th>K</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <button id="csvBtn">NPK CSV保存</button>
  <button id="pngBtn">NPKグラフ PNG保存</button>

  <script type="module" src="app.js"></script>
</body>
</html>
